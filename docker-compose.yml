version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residential_complex_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: residential_complex_db
      DB_USERNAME: root
      DB_PASSWORD: REDACTED_DB_PASSWORD
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
    networks:
      - residential_network

  web:
    image: nginx:1.25-alpine
    container_name: residential_complex_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - residential_network

  db:
    image: mysql:8.0
    container_name: residential_complex_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: REDACTED_DB_PASSWORD
      MYSQL_DATABASE: residential_complex_db
      MYSQL_USER: user
      MYSQL_PASSWORD: REDACTED_DB_PASSWORD
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - residential_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pREDACTED_DB_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: residential_complex_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - residential_network

networks:
  residential_network:
    driver: bridge

volumes:
  db_data:
    driver: local
